#!/bin/bash
# ==================================================
# Nome: Build de Máquina Virtual
# Descrição: Script completo e único para criar, configurar,
#            instalar e preparar uma máquina virtual pronta para uso
# Versão: 1.1.0
# Autor: Seu Nome
# Configuração: 16 GB RAM | 8 Núcleos de CPU | 200 GB Disco
# Sistema Operacional: Ubuntu 24.04 LTS 64 bits
# Ferramenta: VirtualBox
# ==================================================

# ---------------------- CONFIGURAÇÕES PRINCIPAIS ----------------------
VM_NAME="PC-Virtual"
VM_SYSTEM="Ubuntu_64"
VM_RAM=16384          # ✅ 16 GB convertido para MB
VM_CPU=8              # ✅ 8 núcleos de processador
VM_DISK_SIZE=204800   # ✅ 200 GB convertido para MB
VM_DISK_FILE="disco-virtual.vdi"
VM_VIDEO_MEM=256      # Memória de vídeo máxima
ISO_URL="https://releases.ubuntu.com/24.04.1/ubuntu-24.04.1-desktop-amd64.iso"
ISO_FILE="ubuntu-24.04.1.iso"
STORAGE_CTRL_NAME="Controlador-SATA"
IDE_CTRL_NAME="Controlador-IDE"
# -----------------------------------------------------------------------

echo "=================================================="
echo "   🚀 INICIANDO PROCESSO DE BUILD DA MÁQUINA VIRTUAL"
echo "=================================================="
echo "⚙️  ESPECIFICAÇÕES:"
echo "   • Memória RAM:  ${VM_RAM} MB (16 GB)"
echo "   • Núcleos CPU:  ${VM_CPU} unidades"
echo "   • Disco Rígido: ${VM_DISK_SIZE} MB (200 GB)"
echo "   • Memória Vídeo: ${VM_VIDEO_MEM} MB"
echo "   • Sistema Alvo: Ubuntu 24.04 LTS 64 bits"
echo "=================================================="

# ---------------------- VERIFICAÇÕES INICIAIS ----------------------
# Verificar se o VirtualBox está instalado e acessível
if ! command -v VBoxManage &> /dev/null; then
    echo "❌ ERRO CRÍTICO: O programa 'VirtualBox' não foi encontrado no sistema!"
    echo "👉 Solução: Baixe e instale gratuitamente em: https://www.virtualbox.org/wiki/Downloads"
    exit 1
fi

# Verificar se o wget está disponível para download
if ! command -v wget &> /dev/null; then
    echo "⚠️  AVISO: Ferramenta 'wget' não encontrada. Usando alternativa ou seguindo..."
fi

# ---------------------- PREPARAR ARQUIVOS ----------------------
# Baixar imagem do sistema operacional se não existir localmente
if [ ! -f "$ISO_FILE" ]; then
    echo "📥 Baixando imagem do sistema operacional..."
    echo "🔗 Origem oficial: $ISO_URL"
    wget --progress=bar:force -O "$ISO_FILE" "$ISO_URL"
    if [ $? -ne 0 ]; then
        echo "❌ FALHA: Não foi possível baixar a imagem do sistema!"
        echo "👉 Baixe manualmente e salve como: $ISO_FILE"
        exit 1
    fi
    echo "✅ Download concluído com sucesso!"
else
    echo "✅ Imagem do sistema já existe, pulando download..."
fi

# ---------------------- LIMPAR VERSÃO ANTIGA ----------------------
# Remover máquina virtual com o mesmo nome, se já existir
if VBoxManage list vms | grep -q "\"$VM_NAME\""; then
    echo "⚠️  Encontrada máquina virtual antiga com o mesmo nome. Removendo..."
    VBoxManage unregistervm "$VM_NAME" --delete
    echo "✅ Versão antiga removida com sucesso!"
fi

# ---------------------- CRIAR MÁQUINA VIRTUAL ----------------------
echo "🔧 Passo 1/5: Criando estrutura da máquina virtual..."
VBoxManage createvm --name "$VM_NAME" --ostype "$VM_SYSTEM" --register
if [ $? -ne 0 ]; then
    echo "❌ ERRO: Falha ao criar a máquina virtual!"
    exit 1
fi
echo "✅ Máquina virtual criada e registrada!"

# ---------------------- CONFIGURAR HARDWARE ----------------------
echo "⚙️  Passo 2/5: Configurando recursos de hardware..."
VBoxManage modifyvm "$VM_NAME" \
  --memory "$VM_RAM" \
  --cpus "$VM_CPU" \
  --vram "$VM_VIDEO_MEM" \
  --pae on \
  --nestedpaging on \
  --boot1 dvd --boot2 disk --boot3 none --boot4 none \
  --nic1 nat --nictype1 82540EM --cableconnected1 on \
  --audio driver=default --audiocontroller ac97 \
  --usb on --usbehci on
if [ $? -ne 0 ]; then
    echo "❌ ERRO: Falha ao configurar o hardware!"
    exit 1
fi
echo "✅ Hardware configurado: Memória, Processador, Rede, Áudio e USB!"

# ---------------------- CRIAR DISCO VIRTUAL ----------------------
echo "💾 Passo 3/5: Criando disco rígido virtual de 200GB..."
VBoxManage createmedium disk \
  --filename "$(pwd)/$VM_DISK_FILE" \
  --size "$VM_DISK_SIZE" \
  --format VDI \
  --variant Standard
if [ $? -ne 0 ]; then
    echo "❌ ERRO: Falha ao criar o disco virtual!"
    exit 1
fi
echo "✅ Disco virtual criado com sucesso!"

# ---------------------- CONECTAR DISPOSITIVOS ----------------------
echo "🔌 Passo 4/5: Conectando armazenamento e dispositivos..."
# Controlador SATA para disco principal
VBoxManage storagectl "$VM_NAME" --name "$STORAGE_CTRL_NAME" --add sata --controller IntelAhci --portcount 2
VBoxManage storageattach "$VM_NAME" \
  --storagectl "$STORAGE_CTRL_NAME" \
  --port 0 --device 0 --type hdd \
  --medium "$(pwd)/$VM_DISK_FILE"

# Controlador IDE para drive de DVD/Instalação
VBoxManage storagectl "$VM_NAME" --name "$IDE_CTRL_NAME" --add ide --controller PIIX4
VBoxManage storageattach "$VM_NAME" \
  --storagectl "$IDE_CTRL_NAME" \
  --port 0 --device 0 --type dvddrive \
  --medium "$(pwd)/$ISO_FILE"

echo "✅ Disco e imagem de instalação conectados!"

# ---------------------- FINALIZAR ----------------------
echo ""
echo "=================================================="
echo "   ✅ BUILD CONCLUÍDO COM SUCESSO!"
echo "=================================================="
echo "📋 DADOS DA MÁQUINA:"
echo "   Nome:      $VM_NAME"
echo "   Memória:  ${VM_RAM} MB"
echo "   CPU:      ${VM_CPU} núcleos"
echo "   Disco:    ${VM_DISK_SIZE} MB"
echo ""
echo "🚀 Para iniciar use o comando:"
echo "   VBoxManage startvm \"$VM_NAME\""
echo "👉 Ou abra o VirtualBox, selecione '$VM_NAME' e clique em Iniciar"
echo "=================================================="
