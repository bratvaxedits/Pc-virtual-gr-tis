name: Criar e Construir Máquina Virtual
run-name: Build PC Virtual 🖥️ 16GB | 8 Núcleos | 200GB

on:
  workflow_dispatch:
    inputs:
      senha_usuario:
        description: '🔑 Defina uma senha para o usuário (ou deixe padrão)'
        required: true
        default: '123456'
        type: string

jobs:
  build-vm:
    name: Processo Completo da VM
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Baixar código do repositório
        uses: actions/checkout@v4

      - name: ⚙️ Instalar ferramentas necessárias
        run: |
          sudo apt update -y
          # ✅ CORREÇÃO: nomes certos dos pacotes!
          sudo apt install -y qemu-system-x86 qemu-utils wget curl

      - name: 📋 Definir configurações e preparar arquivos
        env:
          VM_NAME: "PC-Virtual"
          VM_RAM: "16384"
          VM_CPU: "8"
          VM_DISK: "200G"
          ISO_URL: "https://releases.ubuntu.com/24.04.1/ubuntu-24.04.1-desktop-amd64.iso"
          ISO_FILE: "ubuntu-24.04.1.iso"
          DISK_FILE: "disco-virtual.qcow2"
          SENHA: "${{ inputs.senha_usuario }}"
        run: |
          echo "=================================================="
          echo "   🚀 INICIANDO PREPARAÇÃO — PC VIRTUAL"
          echo "=================================================="
          echo "⚙️ Configuração: ${VM_RAM}MB RAM | ${VM_CPU} Núcleos | ${VM_DISK} Disco"
          echo "🔑 Senha definida: ${SENHA}"
          echo "=================================================="

          # Baixar ISO do sistema
          if [ ! -f "$ISO_FILE" ]; then
            echo "📥 Baixando imagem do sistema operacional..."
            wget -q --show-progress -O "$ISO_FILE" "$ISO_URL"
          else
            echo "✅ Imagem do sistema já está pronta"
          fi

          # Criar disco virtual — agora funciona!
          echo "💾 Criando disco virtual de ${VM_DISK}..."
          qemu-img create -f qcow2 "$DISK_FILE" "$VM_DISK"

          echo ""
          echo "✅ ARQUIVOS CRIADOS COM SUCESSO!"
          echo "📦 Disco: $DISK_FILE"
          echo "📦 Sistema: $ISO_FILE"
          echo ""
          echo "ℹ️  Baixe os arquivos e abra no VirtualBox/QEMU no seu computador."

      - name: 📤 Salvar arquivos prontos para download
        uses: actions/upload-artifact@v4
        with:
          name: Arquivos-PC-Virtual
          path: |
            *.qcow2
            *.iso
          retention-days: 7

      - name: ✅ Finalizar
        run: |
          echo "=================================================="
          echo "   🎉 PROCESSO CONCLUÍDO SEM ERROS!"
          echo "=================================================="
          echo "📁 Vá em 'Artifacts' abaixo e baixe tudo!"
          
