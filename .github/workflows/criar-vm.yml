name: Criar e Construir Máquina Virtual
run-name: Build PC Virtual 🖥️ 16GB | 8 Núcleos | 200GB

on:
  workflow_dispatch:
    inputs:
      senha_usuario:
        description: '🔑 Defina uma senha para o usuário (ou deixe padrão)'
        required: true
        default: '123456'
        type: string

jobs:
  build-vm:
    name: Processo Completo da VM
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Baixar código do repositório
        uses: actions/checkout@v4

      - name: ⚙️ Instalar ferramentas necessárias
        run: |
          sudo apt update -y
          sudo apt install -y qemu-system-x86 qemu-img wget curl

      - name: 📋 Definir configurações
        env:
          VM_NAME: "PC-Virtual"
          VM_RAM: "16384"
          VM_CPU: "8"
          VM_DISK: "200G"
          ISO_URL: "https://releases.ubuntu.com/24.04.1/ubuntu-24.04.1-desktop-amd64.iso"
          ISO_FILE: "ubuntu-24.04.1.iso"
          DISK_FILE: "disco-virtual.qcow2"
          SENHA: "${{ inputs.senha_usuario }}"
        run: |
          echo "=================================================="
          echo "   🚀 INICIANDO BUILD — PC VIRTUAL"
          echo "=================================================="
          echo "⚙️ Configuração: ${VM_RAM}MB RAM | ${VM_CPU} Núcleos | ${VM_DISK} Disco"
          echo "🔑 Senha definida: ${SENHA}"
          echo "=================================================="

          # Baixar ISO do sistema
          if [ ! -f "$ISO_FILE" ]; then
            echo "📥 Baixando imagem do sistema..."
            wget -q --show-progress -O "$ISO_FILE" "$ISO_URL"
          fi

          # Criar disco virtual
          echo "💾 Criando disco de ${VM_DISK}..."
          qemu-img create -f qcow2 "$DISK_FILE" "$VM_DISK"

          # ✅ CORREÇÃO PRINCIPAL: rodar SEM tela, sem aceleração de vídeo
          echo "🔧 Preparando máquina virtual..."
          qemu-system-x86_64 \
            -name "$VM_NAME" \
            -m "$VM_RAM" \
            -smp "$VM_CPU" \
            -machine q35 \
            -cpu qemu64 \
            -drive file="$DISK_FILE",format=qcow2,if=virtio,cache=writeback \
            -cdrom "$ISO_FILE" \
            -boot d \
            -net nic,model=virtio -net user,hostfwd=tcp::2222-:22 \
            -nographic \
            -serial none \
            -parallel none \
            -monitor none \
            -no-acpi \
            -no-hpet \
            -daemonize

          echo "✅ Máquina virtual criada com sucesso!"
          echo "📦 Arquivos gerados: $DISK_FILE | $ISO_FILE"

      - name: 📤 Salvar arquivos da VM
        uses: actions/upload-artifact@v4
        with:
          name: Arquivos-PC-Virtual
          path: |
            *.qcow2
            *.iso
          retention-days: 7

      - name: ✅ Finalizar
        run: |
          echo "=================================================="
          echo "   🎉 PROCESSO CONCLUÍDO COM SUCESSO!"
          echo "=================================================="
          echo "📁 Baixe os arquivos na aba 'Artifacts' abaixo"
          
